[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-recommendation-engine"
version = "0.1.0"
description = "A skill-aware semantic job search and recommendation system and controlled research platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sumouna Ghosh" },
    { name = "Avik Ghosh" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "spacy>=3.7.0",
    "rapidfuzz>=3.9.0",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "faiss-cpu>=1.8.0",
    "mlflow>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "database*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "src"]
include = ["src", "api", "database", "tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | data
  | models
  | mlruns
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "model: marks tests that load or evaluate ML models",
]
